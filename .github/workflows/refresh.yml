# Runs the data pipeline on GitHub's machines and commits the fresh snapshot.
# Start it from the Actions tab ("Run workflow"), or by changing .github/refresh-trigger.
# Model steps need the GEMINI_API_KEY repo secret; without it, prices, filings,
# rules and numbers still update and the model steps are skipped.
name: Refresh data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/refresh-trigger"]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python -m pipeline.run_all 2>&1 | tee run_log.txt

      - name: Save the run log next to the data
        if: always()
        run: mkdir -p data && cp run_log.txt data/last_run_log.txt || true

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "finn-data-bot"
          git config user.email "finn-data-bot@users.noreply.github.com"
          git add -A web/public/data data
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Data snapshot $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST') [skip ci]"
          git pull --rebase origin main
          git push
